<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 一点米维修派单</title><style>
/* ========== 一点米打印机维修 · 全局样式 ========== */:root{--primary:#2563eb;/* 主色 蓝 */ --primary-dark:#1d4ed8;--accent:#f59e0b;/* 强调 橙 */ --bg:#f5f7fb;--card:#ffffff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--radius:12px;--shadow:0 4px 16px rgba(15,23,42,.08);}*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}a{color:var(--primary);text-decoration:none;}a:hover{text-decoration:underline;}/* ---------- 导航 ---------- */ .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);box-shadow:var(--shadow);position:sticky;top:0;z-index:10;}.nav .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--text);}.nav .brand .logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:grid;place-items:center;font-size:20px;}.nav .links{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}.nav .links a{color:var(--text);font-weight:500;}.nav .phone{background:var(--accent);color:#fff !important;padding:8px 16px;border-radius:999px;font-weight:700;}/* ---------- 容器 ---------- */ .container{max-width:1080px;margin:0 auto;padding:24px;}.page{padding:32px 0 64px;}/* ---------- Hero ---------- */ .hero{background:linear-gradient(135deg,var(--primary),#3b82f6);color:#fff;border-radius:var(--radius);padding:56px 40px;margin-bottom:32px;}.hero h1{font-size:34px;margin-bottom:12px;}.hero p{font-size:17px;opacity:.95;max-width:620px;}.hero .cta{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;}.btn{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:700;cursor:pointer;border:none;font-size:15px;transition:transform .08s ease,box-shadow .2s ease;}.btn:active{transform:translateY(1px);}.btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:var(--primary-dark);text-decoration:none;}.btn-light{background:#fff;color:var(--primary);}.btn-light:hover{text-decoration:none;}.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;}.btn-ghost:hover{background:rgba(255,255,255,.12);text-decoration:none;}.btn-sm{padding:8px 14px;font-size:14px;}.btn-danger{background:var(--danger);color:#fff;}.btn-success{background:var(--success);color:#fff;}.btn-success:hover{background:#15803d;text-decoration:none;}/* ---------- 卡片网格 ---------- */ .grid{display:grid;gap:20px;}.grid-3{grid-template-columns:repeat(3,1fr);}.grid-2{grid-template-columns:repeat(2,1fr);}.card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);}.card h3{font-size:18px;margin-bottom:8px;}.card .ico{font-size:30px;margin-bottom:10px;}.section-title{font-size:24px;font-weight:800;margin:36px 0 18px;}.muted{color:var(--muted);}/* ---------- 流程 ---------- */ .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}.step{background:var(--card);border-radius:var(--radius);padding:20px;text-align:center;box-shadow:var(--shadow);}.step .num{width:40px;height:40px;margin:0 auto 10px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;}/* ---------- 表单 ---------- */ .form-card{max-width:640px;margin:0 auto;}.field{margin-bottom:16px;}.field label{display:block;font-weight:600;margin-bottom:6px;font-size:14px;}.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--text);}.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);}.field textarea{resize:vertical;min-height:90px;}.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}/* ---------- 表格 ---------- */ .table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow);background:#fff;}table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px;}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);}th{background:#f1f5f9;font-weight:700;white-space:nowrap;}tr:last-child td{border-bottom:none;}.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}.tag-pending{background:#fef3c7;color:var(--warning);}.tag-assigned{background:#dcfce7;color:var(--success);}.tag-done{background:#e0e7ff;color:var(--primary);}/* ---------- 提示 ---------- */ .alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;}.alert-info{background:#e0f2fe;color:#0369a1;}.alert-success{background:#dcfce7;color:#166534;}.alert-error{background:#fee2e2;color:#991b1b;}/* ---------- 顶部条 ---------- */ .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}.topbar h2{font-size:22px;}/* ---------- 联系 ---------- */ .contact-box{background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);text-align:center;}.contact-box .big-phone{font-size:30px;font-weight:800;color:var(--primary);}/* ---------- 页脚 ---------- */ .footer{text-align:center;padding:28px 16px;color:var(--muted);font-size:14px;}/* ---------- 空状态 ---------- */ .empty{text-align:center;color:var(--muted);padding:40px;}/* ---------- 响应式 ---------- */ @media (max-width:860px){.grid-3{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}.steps{grid-template-columns:repeat(2,1fr);}.hero{padding:40px 24px;}.hero h1{font-size:26px;}.nav .links{gap:12px;}.row-2{grid-template-columns:1fr;}}@media (max-width:480px){.steps{grid-template-columns:1fr;}.nav .brand{font-size:17px;}.container{padding:16px;}}
</style>
</head>
<body>
  <div class="alert alert-info" style="margin:16px 24px 0;">提示：本派单系统需要部署 Node 后端才能使用。当前为纯静态托管（如 GitHub Pages），仅展示界面，登录与派单功能不可用。</div>
  <nav class="nav">
    <div class="brand">
      <span class="logo">米</span>
      <span>一点米 · 后台</span>
    </div>
    <div class="links">
      <a href="index.html">首页</a>
      <a href="worker.html">工人登录</a>
      <a class="phone" href="tel:18537186299">☎ 18537186299</a>
    </div>
  </nav>

  <div class="container page">
    <!-- 登录 -->
    <div id="loginView" class="card form-card">
      <h2 style="margin-bottom:6px;">管理员登录</h2>
      <p class="muted" style="margin-bottom:18px;">初始账号 刘小红 / 666</p>
      <div id="loginMsg"></div>
      <div class="field">
        <label>账号</label>
        <input id="aid" type="text" placeholder="刘小红" autocomplete="off" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="apwd" type="password" placeholder="666" autocomplete="off" />
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">登录</button>
    </div>

    <!-- 后台主体 -->
    <div id="adminView" style="display:none;">
      <div class="topbar">
        <h2>维修派单管理</h2>
        <div>
          <span class="muted" id="who"></span>
          <button class="btn btn-ghost btn-sm" onclick="doLogout()">退出</button>
        </div>
      </div>

      <!-- 新建派单 -->
      <h3 class="section-title" style="margin-top:8px;">新建派单（分配工人与维修时间）</h3>
      <div class="card form-card" style="margin-bottom:28px;">
        <div id="formMsg"></div>
        <form id="assignForm" onsubmit="createAssignment(event)">
          <div class="field">
            <label>分配工人 *</label>
            <select name="workerId" id="workerSel"></select>
          </div>
          <div class="field">
            <label>维修时间 *</label>
            <input name="repairTime" type="datetime-local" required />
          </div>
          <div class="row-2">
            <div class="field">
              <label>客户姓名 *</label>
              <input name="customerName" required placeholder="客户称呼" />
            </div>
            <div class="field">
              <label>客户电话 *</label>
              <input name="customerPhone" required placeholder="11 位手机号" pattern="1\d{10}" />
            </div>
          </div>
          <div class="field">
            <label>客户地址 *</label>
            <input name="customerAddress" required placeholder="上门维修地址" />
          </div>
          <div class="row-2">
            <div class="field">
              <label>打印机品牌 *</label>
              <input name="brand" required placeholder="惠普 / 佳能 / 爱普生 等" />
            </div>
            <div class="field">
              <label>机型 *</label>
              <input name="model" required placeholder="如 HP M132" />
            </div>
          </div>
          <div class="field">
            <label>故障描述 *</label>
            <textarea name="issue" required placeholder="请描述具体故障现象"></textarea>
          </div>
          <button class="btn btn-primary" type="submit">分配派单</button>
        </form>
      </div>

      <!-- 派单列表 -->
      <h3 class="section-title">派单列表</h3>
      <div id="listBox"></div>
    </div>
  </div>

  <footer class="footer">© 一点米打印机维修服务 · 服务热线 18537186299</footer>

  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
